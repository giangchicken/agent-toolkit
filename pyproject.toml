[project]
name = "agent-toolkit"
version = "0.1.0"
description = "Shared utilities for agent and dataset pipelines: string/JSON/file helpers and an OpenAI-compatible LLM client."
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "MIT" }
dependencies = [
    "json-repair>=0.59.10",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
llm = [
    "openai>=2.0",
    "tenacity>=9.1.4",
    "aiohttp",
    "tiktoken>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_toolkit"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.13.1",
    "types-pyyaml",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["json_repair.*", "tiktoken.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
